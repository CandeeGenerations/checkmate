# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    pull-request-branch-name:
      separator: '-' # Use hyphens to separate branch name segments
    schedule:
      interval: 'monthly'
    ignore:
      # typescript-eslint peer range is `<6.1.0`; TS 7.x (native port) breaks lint.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      minor-updates:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'
  - package-ecosystem: 'github-actions' # Check for updates to GitHub Actions every week
    directory: '/'
    pull-request-branch-name:
      separator: '-'
    schedule:
      interval: 'monthly'
    groups:
      minor-updates:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'
